name: Build Dummy APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Build with Gradle
      run: |
        # 1. Bersihin file lama biar gk tabrakan
        rm -f build.gradle settings.gradle
        
        # 2. Bikin struktur folder standar Android
        mkdir -p app/src/main
        
        # 3. Bikin Manifest dengan namespace BARU: com.kinar.rmdproject
        echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.kinar.rmdproject"><application android:label="rmdproject"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

        # 4. Bikin settings.gradle
        echo "include ':app'" > settings.gradle

        # 5. Bikin build.gradle khusus modul app
        cat <<EOF > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.kinar.rmdproject'
            compileSdk 33
            defaultConfig {
                applicationId "com.kinar.rmdproject"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        # 6. Bikin build.gradle di root (buat classpath)
        cat <<EOF > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        EOF

        # 7. Jalanin Build
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: template-apk
        path: app/build/outputs/apk/debug/*.apk
